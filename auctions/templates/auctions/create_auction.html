{% extends "auctions/layout.html" %}

{% block body %}
<section class="container-panel">
    <div class="tab-pane tabs-animation fade active show" id="tab-content-1" role="tabpanel">
        <div class="main-card mb-3 card sell-panel">
            <div class="card-body">
                <h5 class="card-title-sell">Sell your item</h5>
                <form method='post'action="{% url 'post_listing' %}" >
                    {% csrf_token %}
                    <div class="position-relative row form-group">
                        <label for="title" class="col-sm-2 col-form-label">Title</label>
                        <div class="col-sm-4">
                            {{ sellForm.title }}
                        </div>
                    </div>
                    <div class="position-relative row form-group">
                        <label for="description" class="col-sm-2 col-form-label">Description</label>
                        <div class="col-sm-6">
                            {{ sellForm.description }}
                        </div>
                    </div>
                    <div class="position-relative row form-group">
                        <label for="exampleSelect" class="col-sm-2 col-form-label">Category</label>
                        <div class="col-sm-4">
                            <select name="category" id="exampleSelect" class="form-control">
                                <option value="" selected="selected"> -- Please select -- </option>                                
                                {% for category in categories %}
                                    <option value="{{ category.id }}">{{ category.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="position-relative row form-group">
                        <label for="price" class="col-sm-2 col-form-label">Price</label>
                        <div class="col-sm-3">
                            {{ sellForm.price }}
                        </div>
                    </div>
                    <div class="position-relative row form-group">
                        <label for="url" class="col-sm-2 col-form-label">Url Image</label>
                        <div class="col-sm-6">
                            {{ sellForm.image }}
                        </div>
                    </div>
                    <div class="position-relative row form-check">
                        <div class="col-sm-10 offset-sm-2">
                            <button type="submit" class="btn btn-secondary" name="button">Submit</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
{% endblock %}
